[project]
name = "bricks-api"
version = "0.1.0"
description = "FastAPI backend for the Bricks rewrite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.13.2",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "pydantic-settings==2.6.0",
    "pyjwt==2.9.0",
    "psycopg[binary]==3.2.3",
    "python-multipart==0.0.12",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.32.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]
