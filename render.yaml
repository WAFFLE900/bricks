databases:
  - name: bricks-postgres
    databaseName: bricks
    user: bricks
    plan: free

services:
  - type: web
    name: bricks-api
    runtime: docker
    rootDir: apps/api
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bricks-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

staticSites:
  - name: bricks-web
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
